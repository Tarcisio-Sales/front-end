<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas vindas</title>
    <style>
    
        input{
            height: 50px;
            border: 2px solid darkblue;
            width: 40vw;
            text-align: center;
            color: darkgreen;
            font-size: 1.5em;
            margin: auto;
        }
        h1{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Boas vindas</h1>
    <p><input type="button" id="nome" value="Inicie o desafio" onclick="clicar()"></p>

    <script>
        
        function clicar(){
            var nome = window.prompt('Qual o seu nome?')
            var idade = Number(window.prompt(`Olá, ${nome}! Quantos anos você tem?`))
            window.alert(`Acabei de conhecer ${nome}, que tem ${idade} de idade.`)
        }        

    </script>
</body>
</html>
