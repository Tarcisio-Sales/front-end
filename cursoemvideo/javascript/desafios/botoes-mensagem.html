<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botoes</title>
    <style>

        input{
            height: 50px;
        }

    </style>
</head>
<body>
    <h1>Desafio das mensagens</h1>
    <input type="button" value="BOTÃO 1" onclick="clicar(1)">
    <input type="button" value="BOTÃO 2" onclick="clicar(2)"> 
    <input type="button" value="BOTÃO 3" onclick="clicar(3)"> 
    <input type="button" value="BOTÃO 4" onclick="clicar(4)">

    <script>

        function clicar(n){
            window.alert(`Você clicou no ${n}° Botão`)
        }
        
    </script>
</body>
</html>
