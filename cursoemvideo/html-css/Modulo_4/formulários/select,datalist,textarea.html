<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="arquivo-teste.php" method="post" autocomplete="on"> 
    <p> 
        <!-- Select: lista rigida-->
        <label>Estado
            <select name="estado" id="iestado">
                <option value="" selected  >---Escolha um Estado---</option>
                <optgroup label="Região Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="ES">Espirito Santo</option>
                </optiongroup>

                <optgroup label="Região Nordeste">
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                    <option value="BA">Bahia</option>
                </optiongroup>
            </select>
        </label>
    </p>
    <!-- Datalist: lista sugestiva -->
    <p>
        <label for="iprof">Profissão:</label>
        <input type="text" name="prof" id="iprof" list="listprof">
        <datalist id="listprof">
            <option>Contador</option>
            <option>Administrador</option>
            <option>Engenheiro</option>
            <option>Arquiteto</option>
        </datalist>
    </p>

    <p> 
        <!-- TextArea: sempre usar metodo POST -->
        <label for="imsg">Mensagem</label><br>
        <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Sua Mensagem..."></textarea>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>    
    </form>
</body>
</html>
