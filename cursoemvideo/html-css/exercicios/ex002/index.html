<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
   <h1>Parágrafos e quabras de linha</h1> 
   <hr>
   <p>Você pode escreve um parágrafo de qualquer jeito. Basta colocar entre um par de tag &lt;p&gt; e &lt;/p&gt; <!-- LESS THAN / GREATER THAN-->
   <p>Se você precisar quebrar o texto como esse <br>você pode usar a tag &lt;br&gt;.</p>
   <p>Vamos adicionar alguns simbólos especiais:
    &reg;
    &copy;
    &trade;
    &euro;
    &pound;
    &yen;
    &cent;
    &delta;
    &Delta;
    &uarr;
   </p>
   <p>Vamos adicionar alguns emoji:
    &#x1F596;
    &#x1F913;      
    
   </p>
</body>
</html>
