<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        
        table{
            width: 500px;
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
       

       
       

    </style>

</head>
<body>
    <!--
    Analomia para tabelas grandes

        TABLE
              CAPTION
              THEAD
                TR, TD, TH
              TBODY
                TR, TD, TH
              TFOOT
                TR, TD, TH
    -->
    <h1>Mesclagem de celulas</h1>
    <table>
            <tr>
                <td rowspan="2">A</td>
                <td colspan="2">B</td>
            </tr>
            <tr>
                
                <td>E</td>
                <td>F</td>
            </tr>
            <tr>
                <td>G</td>
                <td colspan="2">H</td>
                
            </tr>
    </table>
</body>
</html>
