<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com google fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        
        body{
            font-family: 'Work Sans';
            font-size: 20px; 
            font-weight: normal; 
            font-style: italic; 
        }
        h1{
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>TÍTULO</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sed amet ea deleniti quisquam cupiditate maiores veniam ullam accusantium autem qui, porro soluta perspiciatis. Maiores perspiciatis nihil culpa obcaecati, modi expedita.</p>
</body>
</html>
