<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{ /*box-level*/
            
            /*display: inline; transforma o box-level em inline*/
            background-color: lightcyan;
            height: 300px;
            width: 300px;
            
            /*Cria uma borda*/
            border-width: 15px;
            border-style: double; /*solid, groove, dashed, dotted,double*/
            border-color: darkgrey;

            /* border: 10px solid darkgray; substitui o comando de cima*/
            
            /*Afasta o conteúdo da borda*/
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            /*padding: 10px 10px 10 px 10x; substitui o comando a cima(sorthand) na ordem do relógio. E se todas as medidas forem iguais padding: 10px;

            /*margin: auto; deixa o elemento centralizado independente do tamanho da tela*/
            
            /*margin: 10px auto 40px auto; esquerda e direita ficam auto*/

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 40px;
            margin-left: 10px;

            /*outline: 5px dashed salmon;*/

            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;

        }
        a{ /*inline-level*/

            /*display: block ou inline-block; transforma o inline em box-level e inline-block com algumas caracteristicas de box-level*/
            border-width: 10px;
            border-style: dotted;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de caixa box-level, <a href="#">mas os links são exemplos de inline-levels</a>. Vamos ver como tudo isso fonciona.</p>
</body>
</html>
