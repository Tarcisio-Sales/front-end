<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul type="square">
        <li><abbr title="Utilize a tag <p>">Parágrafo  </abbr></li>
        <li><abbr title="Utilize a tag <h>">Títulos</abbr></li>
        <li><abbr title="Utilize img">Imagens</abbr></li>
        <li><abbr title="Utilize a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="Utilize a tag <code> + <pre> antes de code">Código-fonte</abbr></li>
        <li><abbr title="Utilize a tag <ol> + type a,A,i,I ">Lista númeradas</abbr></li>
        <li><abbr title="Utilize a tag <ul> e type circulo,square">Lista com demarcadores</abbr></li>
    </ul>
</body>
</html>
